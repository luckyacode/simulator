spring:
  application:
    name: simulator
  threads:
    virtual:
      enabled: true # Enable Java 21 Virtual Threads natively
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://${db-host:129.151.21.182}:${DB_PORT:5432}/${postgres-db:pnr_db}
    driver-class-name: org.postgresql.Driver
    username: ${postgres-user:root}
    password: ${postgres-password:pnr_db}
    hikari:
      maximum-pool-size: 4 # 🌟 FIXED: Changed '=' syntax to a valid colon structure

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:129.151.21.182:29092}

    consumer:
      isolation-level: read_committed
      enable-auto-commit: false
      # 🌟 FIXED: Swapped out Confluent Avro Deserializers for Spring's ErrorHandling JSON stack
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        # 🌟 FIXED: Configured the correct property suffix key for the delegate class execution
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"

    producer:
      acks: all
      transaction-id: tx-dcs-booking-
      # 🌟 FIXED: Swapped out Avro Serializer for the standard Jackson JSON engine
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    template:
      observation-enabled: true
    listener:
      ack-mode: MANUAL_IMMEDIATE
      observation-enabled: true

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin: # 🌟 FIXED: Changed 'Zipkin' to lowercase 'zipkin' for proper Spring Boot recognition
    tracing:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: "health,liveness,readiness,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: simulator # 🌟 FIXED: Changed from 'api-pnr-gateway' to match this app's name

server:
  port: ${SERVER_PORT:8080} # 🌟 Note: This microservice is mapped to bind on port 8080

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}]"