name: Spring Boot CI/CD Pipeline

on:
  push:
    branches: [ "devonly-specific" ]
  pull_request:
    branches: [ "devonly-specific" ]

# Grant permissions required to push images to GitHub Packages (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  # --- STAGE 1: BUILD & PUSH DOCKER IMAGE TO GHCR ---
  build-and-ship:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/devonly' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tagging)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # --- STAGE 2: AUTOMATED DEPLOY TO ORACLE CLOUD ---
  deploy-to-oci:
    needs: build-and-ship
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/devonly' && github.event_name == 'push'

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Successfully connected to Oracle Cloud Instance!"
            
            # Convert repo path to lowercase for GHCR compliance
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_URI="ghcr.io/${REPO_LOWER}:latest"
            
            echo "Targeting Image Registry: ${IMAGE_URI}"
            
            # Authenticate the OCI runtime environment to pull from GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            # 1. Pull the newly baked image down from GitHub Packages
            sudo docker pull ${IMAGE_URI}
            
            # 2. Stop and remove the old running container if it exists
            sudo docker stop simulator-container || true
            sudo docker rm simulator-container || true
            
            # 3. Spin up the new container mapped to server port 8080
            sudo docker run -d \
              --name simulator-container \
              --network praveen_default \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=docker \
              --restart always \
              ${IMAGE_URI}
            
            # 4. Clean up dangling old images to preserve storage space
            sudo docker image prune -f
            sudo docker logout ghcr.io
            
            echo "Deployment completed successfully! Running containers:"
            sudo docker ps