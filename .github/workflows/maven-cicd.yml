name: Spring Boot CI/CD Pipeline

on:
  push:
    branches: [ "devonly" ]
  pull_request:
    branches: [ "devonly" ]

jobs:
  # --- STAGE 1: TEST, VERIFY & QUALITY SCAN ---
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run Tests and Sonar Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=luckyacode_simulator \
            -Dsonar.organization=luckyacode \
            -Dsonar.host.url=https://sonarcloud.io

  # --- STAGE 2: BUILD & PUSH DOCKER IMAGE ---
  build-and-ship:
    needs: test-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/devonly' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract Metadata (Tagging)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/appthree
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # --- NEW STAGE 3: AUTOMATED DEPLOY TO ORACLE CLOUD ---
  deploy-to-oci:
    needs: build-and-ship # Safeguard: Only deploy if image pushes successfully
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/devonly' && github.event_name == 'push'

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Successfully connected to Oracle Cloud Instance!"
            
            # 1. Pull the newly baked image down from Docker Hub
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/appthree:latest
            
            # 2. Stop and remove the old running container if it exists
            sudo docker stop appthree-container || true
            sudo docker rm appthree-container || true
            
            # 3. Spin up the new container mapped to server port 8080
            sudo docker run -d \
              --name appthree-container \
              -p 8080:8080 \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/appthree:latest
            
            # 4. Clean up dangling old images to save free tier storage
            sudo docker image prune -f
            
            echo "Deployment completed successfully! Running containers:"
            sudo docker ps