version: '3.8'
services:
  elasticsearch:
    image: elasticsearch:7.17.10
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - 9200:9200

  logstash:
    image: logstash:7.17.10
    command: >
      bash -c "echo 'input { tcp { port => 5000 codec => json } } 
      output { elasticsearch { hosts => [\"elasticsearch:9200\"] index => \"springboot-logs-%{+YYYY.MM.dd}\" } }' > /usr/share/logstash/pipeline/logstash.conf 
      && bin/logstash"
    ports:
      - 5000:5000
    depends_on:
      - elasticsearch

  kibana:
    image: kibana:7.17.10
    ports:
      - 5601:5601
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

